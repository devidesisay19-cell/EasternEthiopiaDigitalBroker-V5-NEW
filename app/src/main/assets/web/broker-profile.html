<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broker Profile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<style>
:root{--primary:#0f766e;--primary-dark:#115e59;--dark:#172033;--muted:#667085;--white:#fff;--border:#e4e7ec;--background:#f5f7fb;--success:#15803d;--radius:16px;--shadow:0 4px 14px rgba(16,24,40,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans Ethiopic",system-ui,sans-serif;background:var(--background);color:var(--dark);padding-bottom:84px}
.top{background:var(--primary);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.top a{color:#fff;text-decoration:none;font-size:22px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.head{display:flex;gap:14px;align-items:center;background:var(--white);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.av{width:72px;height:72px;border-radius:50%;background:#ccfbf1;color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.ver{color:var(--success);font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0}
.tab{border:1px solid var(--border);background:var(--white);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.item{display:flex;gap:12px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:10px;cursor:pointer}
.th{width:84px;height:84px;border-radius:12px;background:#eef2f6;flex:none;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.t{font-weight:600;font-size:15px}.s{color:var(--muted);font-size:13px;margin-top:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--border);padding:10px 16px;display:flex;gap:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar a{flex:1;text-align:center;text-decoration:none;color:#fff;background:var(--primary);padding:13px;border-radius:12px;font-weight:600}
.bar a.wa{background:#15803d}
.empty{color:var(--muted);text-align:center;padding:24px}
</style></head><body>
<div class="top"><a href="index.html">&#8592;</a><b>Broker</b></div>
<div class="wrap">
  <div class="head"><div class="av" id="av"></div><div><div id="nm" style="font-size:19px;font-weight:700"></div><div id="ct" style="color:var(--muted);font-size:13px"></div><div class="ver" id="vf"></div></div></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"><div class="empty">Loading...</div></div>
</div>
<div class="bar" id="bar" style="display:none"></div>
<script>
const SUPABASE_URL="https://ubkfrpkapqnlaiscrxim.supabase.co";
const SUPABASE_KEY="sb_publishable_5EokG_AyxU4BvcMiq1zyqg_B-NIMoeE";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const id=new URLSearchParams(location.search).get("id");
const esc=v=>String(v==null?"":v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const KINDS=[["all","All"],["property","Property"],["job","Jobs"],["marketplace","Marketplace"],["car","Cars"]];
let broker=null,items=[],kind="all";
function wa(p){let n=String(p||"").replace(/[^\d+]/g,"");return n.startsWith("+")?n.slice(1):n.startsWith("0")?"251"+n.slice(1):n}
function img(u){return u?'<img src="'+esc(u)+'" alt="">':""}
function propImg(p){const r=(p.property_images||[]).sort((a,b)=>(a.display_order||0)-(b.display_order||0))[0];return r?db.storage.from("property-images").getPublicUrl(r.storage_path).data.publicUrl:""}
function render(){
  document.getElementById("tabs").innerHTML=KINDS.map(k=>'<span class="tab '+(k[0]===kind?"on":"")+'" onclick="kind=\''+k[0]+'\';render()">'+k[1]+'</span>').join("");
  const l=items.filter(i=>kind==="all"||i.kind===kind);
  document.getElementById("list").innerHTML=l.length?l.map(i=>'<div class="item" onclick="open_(\''+i.kind+'\',\''+esc(i.id)+'\')"><div class="th">'+img(i.img)+'</div><div><div class="t">'+esc(i.title)+'</div><div class="s">'+esc(i.sub)+'</div></div></div>').join(""):'<div class="empty">No listings yet.</div>';
}
function open_(k,i){location.href=k==="property"?"property-details.html?id="+encodeURIComponent(i):k==="job"?"job-details.html?id="+encodeURIComponent(i):"listing-details.html?kind="+k+"&id="+encodeURIComponent(i)}
(async()=>{
  try{
    const {data:b,error}=await db.from("brokers").select("*").eq("id",id).single();
    if(error||!b)throw error||new Error("Not found");
    broker=b;
    document.getElementById("nm").textContent=b.display_name;
    document.getElementById("av").innerHTML=b.photo_url?img(b.photo_url):esc((b.display_name||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase());
    document.getElementById("vf").textContent=b.is_verified?"\u2713 Verified":"";
    const {data:c}=await db.from("locations").select("name").eq("id",b.city_id).maybeSingle();
    document.getElementById("ct").textContent="City Admin \u00b7 "+(c?c.name:"");
    const w=wa(b.whatsapp||b.phone);
    document.getElementById("bar").innerHTML=(b.phone?'<a href="tel:'+esc(b.phone)+'">Call</a>':"")+(w?'<a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+w+'">WhatsApp</a>':"");
    document.getElementById("bar").style.display="flex";
    const u=b.user_id;
    const [p,j,m,c2]=await Promise.all([
      db.from("properties").select("id,title,price,listing_type,property_images(storage_path,display_order)").eq("owner_id",u).eq("status","published").order("created_at",{ascending:false}),
      db.from("jobs").select("id,title,company_name").eq("employer_id",u).eq("status","published").order("created_at",{ascending:false}),
      db.from("marketplace_items").select("id,title,price,listing_type,photo_urls").eq("seller_id",u).eq("status","published").order("created_at",{ascending:false}),
      db.from("cars").select("id,title,price,listing_type,photo_urls").eq("seller_id",u).eq("status","published").order("created_at",{ascending:false})
    ]);
    items=[
      ...(p.data||[]).map(x=>({kind:"property",id:x.id,title:x.title,sub:(x.listing_type||"")+" \u00b7 "+(x.price||"")+" ETB",img:propImg(x)})),
      ...(j.data||[]).map(x=>({kind:"job",id:x.id,title:x.title,sub:x.company_name||"",img:""})),
      ...(m.data||[]).map(x=>({kind:"marketplace",id:x.id,title:x.title,sub:(x.listing_type||"")+" \u00b7 "+(x.price||"")+" ETB",img:(x.photo_urls||[])[0]||""})),
      ...(c2.data||[]).map(x=>({kind:"car",id:x.id,title:x.title,sub:(x.listing_type||"")+" \u00b7 "+(x.price||"")+" ETB",img:(x.photo_urls||[])[0]||""}))
    ];
    render();
  }catch(e){console.error(e);document.getElementById("list").innerHTML='<div class="empty">Could not load this broker.</div>'}
})();
</script></body></html>
